name: idea_genome
description: 想法基因图谱 - 用AI思维可视化你的创意宇宙
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.5
  
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  get_it: ^7.6.4
  dartz: ^0.10.1
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  uuid: ^4.2.1
  intl: ^0.19.0
  collection: ^1.18.0
  
  flutter_slidable: ^3.0.1
  flutter_staggered_animations: ^1.1.1
  
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  
  flutter_secure_storage: ^9.0.0
  
  speech_to_text: ^6.6.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
